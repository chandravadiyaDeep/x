[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "numpa-readiness"
version = "0.1.0"
description = "NUMPA ML Readiness Assessment engine"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[tool.setuptools.packages.find]
where = ["src"]
